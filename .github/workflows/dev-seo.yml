name: Refresh Development SEO card pages
# Development validation/packages. GitHub Pages itself deploys from main via the repository's dynamic Pages workflow.
# Wait for the source commit's Pages deployment before pushing the manifest commit to avoid overlapping deployments.
on:
  workflow_dispatch: null
  schedule:
  - cron: 17 3 * * *
  push:
    branches:
    - main
    paths:
    - .github/workflows/dev-seo.yml
    - tools/generate-seo.mjs
    - COLLECT_TCG_BASELINE.md
    - README.md
    - package.json
    - docs/**
    - migrations/**
    - supabase/functions/**
    - dev/src/features/owner/insights-dashboard.js
    - dev/src/features/owner/insights-extension-host.js
    - dev/src/features/owner/insights-intent-rates.js
    - dev/src/features/social/posts.js
    - dev/src/features/social/posts-*.js
    - dev/src/features/inventory/page.js
    - dev/src/features/inventory/page-shell.js
    - dev/src/features/inventory/pagination.js
    - dev/src/features/cards/modal-keyboard.js
    - dev/src/features/content/home.js
    - dev/src/features/content/information.js
    - dev/src/features/media/collage.js
    - dev/src/styles/01-foundation.css
    - dev/src/styles/02-components.css
    - dev/src/styles/27-insights-dashboard.css
    - dev/src/styles/29-home-brand-spotlight.css
    - dev/src/styles/30-ai-card-scanner.css
    - dev/src/styles/31-ebay-banlist.css
    - dev/src/features/inventory/filtering.js
    - dev/src/features/inventory/ordering.js
    - dev/src/features/owner/lifecycle.js
    - dev/src/features/owner/tools.js
    - dev/src/features/owner/bulk-status.js
    - dev/src/features/owner/bulk-metadata.js
    - dev/src/features/owner/card-owner-category.js
    - dev/src/features/owner/card-scanner.js
    - dev/src/features/owner/card-scanner-style.js
    - dev/src/features/owner/ebay-banlist.js
    - dev/src/features/owner/dashboard.js
    - dev/src/features/owner/image-maintenance.js
    - dev/src/app/navigation.js
    - dev/src/features/cards/repository.js
    - dev/src/features/cards/related.js
    - dev/index.html
    - dev/src/app/register-features.js
    - dev/src/app/startup.js
    - dev/src/features/cards/tiles.js
    - dev/src/services/catalogue.js
    - dev/src/app/routing.js
    - dev/src/ui/notifications.js
    - dev/src/services/analytics.js
    - dev/src/features/core/utilities.js
    - dev/src/features/cards/details.js
    - dev/src/features/cards/compare.js
    - dev/src/main.js
    - tests/**
    - tools/check.mjs
    - tools/check-css.mjs
    - tools/release-contracts.sh
permissions:
  contents: write
  actions: read
concurrency:
  group: dev-seo-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Run feature regression tests
      run: npm test
    - name: Validate changed Owner JavaScript
      run: |
        node --check dev/src/features/owner/dashboard.js
        node --check dev/src/features/owner/card-scanner.js
        node --check dev/src/features/owner/card-scanner-style.js
        node --check dev/src/features/owner/ebay-banlist.js
        node --check dev/src/features/social/posts-hidden-ebay.js
        node --check dev/src/app/register-features.js
        node --check dev/src/main.js
    - name: Validate eBay Ban List navigation insertion regression
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        class FakeNode {
          constructor(){ this.parentNode=null; this.children=[]; }
          appendChild(node){ node.parentNode=this; this.children.push(node); return node; }
          insertBefore(node,before){
            if(before.parentNode!==this) throw new Error("insertBefore reference is not a child");
            node.parentNode=this;
            this.children.splice(this.children.indexOf(before),0,node);
            return node;
          }
        }
        const container=new FakeNode();
        const nestedParent=new FakeNode();
        const before=new FakeNode();
        container.appendChild(nestedParent);
        nestedParent.appendChild(before);
        const link=new FakeNode();
        if(before?.parentNode) before.parentNode.insertBefore(link,before); else container.appendChild(link);
        if(link.parentNode!==nestedParent || nestedParent.children[0]!==link || nestedParent.children[1]!==before){
          throw new Error("eBay Ban List navigation insertion regression");
        }
        console.log("Nested navigation insertion passed.");
        NODE
    - name: Validate SEO generator syntax and self-test
      run: |
        node --check tools/generate-seo.mjs
        node tools/generate-seo.mjs --self-test
    - name: Generate Development SEO card pages
      run: node tools/generate-seo.mjs --dev
    - name: Validate JavaScript and repository references
      run: npm run check
    - name: Validate CSS and retained release contracts
      shell: bash
      run: |
        npm run check:css
        bash tools/release-contracts.sh
    - name: Commit refreshed SEO pages
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add dev/cards dev/sitemap.xml dev/robots.txt dev/seo-slugs.json dev/owner-card-routes.json
        if git diff --cached --quiet; then
          echo "SEO output already current."
          exit 0
        fi
        git commit -m "chore: refresh Development SEO card pages [skip ci]"
        git push
    - name: Create Development release packages
      shell: bash
      env:
        RELEASE_VERSION: 2026-10-27-v01
        PREVIOUS_VERSION: 2026-10-25-v09
        PREVIOUS_COMMIT: ce875d0722014881bd577a06953730c7be25c2b9
      run: |
        set -euo pipefail
        mkdir -p release
        FULL="release/Collect-TCG-Dev-${RELEASE_VERSION}-full.zip"
        PATCH="release/Collect-TCG-Dev-${PREVIOUS_VERSION}-to-${RELEASE_VERSION}-patch.zip"
        git archive --format=zip --output="${FULL}" HEAD
        rm -rf .release-patch
        mkdir -p .release-patch
        while IFS= read -r -d '' path; do
          mkdir -p ".release-patch/$(dirname "$path")"
          cp -a "$path" ".release-patch/$path"
        done < <(git diff --name-only --diff-filter=ACMRT -z "${PREVIOUS_COMMIT}" HEAD)
        git diff --name-only --diff-filter=D "${PREVIOUS_COMMIT}" HEAD > .release-patch/PATCH-DELETIONS.txt
        (cd .release-patch && zip -qr "../${PATCH}" .)
        unzip -tq "${FULL}"
        unzip -tq "${PATCH}"
    - name: Upload Development release packages
      uses: actions/upload-artifact@v4
      with:
        name: Collect-TCG-Dev-2026-10-27-v01-packages
        path: |
          release/Collect-TCG-Dev-2026-10-27-v01-full.zip
          release/Collect-TCG-Dev-2026-10-25-v09-to-2026-10-27-v01-patch.zip
        if-no-files-found: error
        retention-days: 30
    - name: Wait for source Pages deployment to settle
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        SOURCE_SHA="$(git rev-parse HEAD)"
        echo "Waiting for dynamic Pages deployment for ${SOURCE_SHA} before creating the manifest commit."
        for attempt in $(seq 1 60); do
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/355986577/runs?head_sha=${SOURCE_SHA}&per_page=5")"
          STATE="$(printf '%s' "$RUN_JSON" | jq -r '.workflow_runs[0] | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end')"
          echo "Pages state: ${STATE}"
          case "$STATE" in
            completed:success) exit 0 ;;
            completed:failure|completed:cancelled|completed:timed_out|completed:action_required)
              echo "Source Pages deployment did not succeed: ${STATE}" >&2
              exit 1
              ;;
          esac
          sleep 5
        done
        echo "Timed out waiting for source Pages deployment." >&2
        exit 1
    - name: Record package validation manifest
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p release-manifests
        MANIFEST="release-manifests/2026-10-27-v01.txt"
        if [[ -e "$MANIFEST" ]]; then
          echo "Release manifest already exists and is immutable: $MANIFEST"
          exit 0
        fi
        {
          echo "Version: 2026-10-27-v01"
          echo "Previous version: 2026-10-25-v09"
          echo "Source commit: $(git rev-parse HEAD)"
          echo "Full ZIP: Collect-TCG-Dev-2026-10-27-v01-full.zip"
          echo "Patch ZIP: Collect-TCG-Dev-2026-10-25-v09-to-2026-10-27-v01-patch.zip"
          echo
          sha256sum release/*.zip
        } > "$MANIFEST"
        git add "$MANIFEST"
        git commit -m "Development 2026-10-27-v01: record package validation"
        git push
