name: Refresh Development SEO card pages

# SEO refresh is deliberately release-agnostic. Release packaging and immutable
# manifests belong to release-dev.yml and must never be coupled to scheduled SEO.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dev-seo.yml'
      - 'tools/generate-seo.mjs'
      - 'tools/check-seo-workflow.mjs'
      - 'tools/check.mjs'
      - 'tools/check-css.mjs'
      - 'COLLECT_TCG_BASELINE.md'
      - 'README.md'
      - 'package.json'
      - 'docs/**'
      - 'migrations/**'
      - 'supabase/functions/**'
      - 'dev/src/**'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: dev-seo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run feature regression tests
        run: npm test
      - name: Validate repository and CSS
        run: |
          npm run check
          npm run check:css
      - name: Guard SEO workflow against release coupling
        run: node tools/check-seo-workflow.mjs
      - name: Validate SEO generator syntax and self-test
        run: |
          node --check tools/generate-seo.mjs
          node tools/generate-seo.mjs --self-test
      - name: Generate Development SEO card pages
        run: node tools/generate-seo.mjs --dev
      - name: Validate generated SEO files
        shell: bash
        run: |
          set -euo pipefail
          test -s dev/sitemap.xml
          test -s dev/robots.txt
          test -s dev/seo-slugs.json
          test -s dev/owner-card-routes.json
          grep -q '<urlset' dev/sitemap.xml
          grep -q 'index,follow,max-image-preview:large' dev/cards/*/index.html
          if grep -Eq '/cards/[^<]*/?--[0-9a-fA-F-]{20,40}/' dev/sitemap.xml; then
            echo 'UUID found in public Development card URL' >&2
            exit 1
          fi
      - name: Commit refreshed SEO pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dev/cards dev/sitemap.xml dev/robots.txt dev/seo-slugs.json dev/owner-card-routes.json
          if git diff --cached --quiet; then
            echo 'SEO output already current.'
          else
            git commit -m 'chore: refresh Development SEO card pages [skip ci]'
            git push
          fi
