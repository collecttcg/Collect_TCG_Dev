name: Development Release
# 2026-11-27-v06 — Show Holding Strategy in private Card Details.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-dev.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: development-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Development validation
        run: |
          npm run validate
          node tools/check-owner-login.mjs
          node tools/check-facebook-ebay-post.mjs
          node tools/check-private-facebook-listing.mjs
          node tools/check-sold-download-ribbon.mjs
          node tools/check-ebay-inventory-cleanup.mjs
      - name: Verify SEO workflow and generator
        run: |
          node tools/check-seo-workflow.mjs
          node --check tools/generate-seo.mjs
          node tools/generate-seo.mjs --self-test
          node tools/generate-seo.mjs --production --self-test
          test -s dev/collections/one-piece-carddass-hyper-battle/index.html
          grep -q 'noindex,nofollow,noarchive' dev/collections/one-piece-carddass-hyper-battle/index.html
          grep -q '/dev/collections/one-piece-carddass-hyper-battle/' dev/sitemap.xml
      - name: Create and verify packages
        env:
          RELEASE_VERSION: 2026-11-27-v06
          PREVIOUS_VERSION: 2026-11-27-v05
          PREVIOUS_COMMIT: 738fb6362c1a845757d217b88b5029617f8a5475
        run: |
          set -euo pipefail
          rm -rf .release-patch release
          mkdir -p release .release-patch
          FULL="release/Collect-TCG-Dev-${RELEASE_VERSION}-full.zip"
          PATCH="release/Collect-TCG-Dev-${PREVIOUS_VERSION}-to-${RELEASE_VERSION}-patch.zip"
          git archive --format=zip --output="$FULL" HEAD
          while IFS= read -r -d '' path; do mkdir -p ".release-patch/$(dirname "$path")"; cp -a "$path" ".release-patch/$path"; done < <(git diff --name-only --diff-filter=ACMRT -z "$PREVIOUS_COMMIT" HEAD)
          git diff --name-only --diff-filter=D "$PREVIOUS_COMMIT" HEAD > .release-patch/PATCH-DELETIONS.txt
          (cd .release-patch && zip -qr "../$PATCH" .)
          unzip -tq "$FULL"
          unzip -tq "$PATCH"
          sha256sum "$FULL" "$PATCH" | tee release/checksums.txt
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Dev-2026-11-27-v06-packages
          path: |
            release/Collect-TCG-Dev-2026-11-27-v06-full.zip
            release/Collect-TCG-Dev-2026-11-27-v05-to-2026-11-27-v06-patch.zip
            release/checksums.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record immutable release manifest
        run: |
          set -euo pipefail
          MANIFEST='release-manifests/2026-11-27-v06.txt'
          test ! -e "$MANIFEST"
          {
            echo 'Version: 2026-11-27-v06'
            echo 'Previous version: 2026-11-27-v05'
            echo "Source commit: $(git rev-parse HEAD)"
            echo 'Purpose: Show Holding Strategy in private Card Details.'
            echo 'Full ZIP: Collect-TCG-Dev-2026-11-27-v06-full.zip'
            echo 'Patch ZIP: Collect-TCG-Dev-2026-11-27-v05-to-2026-11-27-v06-patch.zip'
            echo 'Changed files: Card Details, module cache references, baseline and release workflow.'
            echo 'SQL required: No new migration.'
            echo 'Validation: Owner sign-in interaction and verification fixtures; npm run validate; SOLD ribbon, private Facebook URL, eBay cleanup and Facebook eBay fixtures; SEO workflow guard and generator self-test; full and patch ZIP integrity.'
            echo 'Validation limitations: Interactive desktop, mobile and Safari rendering checks were not exercised by CI.'
            echo
            cat release/checksums.txt
          } > "$MANIFEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MANIFEST"
          git commit -m 'Development 2026-11-27-v06: record package validation'
          git pull --rebase origin main
          git push
