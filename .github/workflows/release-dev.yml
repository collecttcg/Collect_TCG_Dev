name: Development Release
# 2026-11-14-v01: validate the current Development release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-dev.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: development-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Development validation
        run: npm run validate
      - name: Verify SEO workflow and generator
        run: |
          node tools/check-seo-workflow.mjs
          node --check tools/generate-seo.mjs
          node tools/generate-seo.mjs --self-test
      - name: Create and verify packages
        env:
          RELEASE_VERSION: 2026-11-14-v01
          PREVIOUS_VERSION: 2026-11-12-v07
          PREVIOUS_COMMIT: aa545e2de5c5398f2afdc70ab04e36457fc1bcd1
        run: |
          set -euo pipefail
          rm -rf .release-patch release
          mkdir -p release .release-patch
          FULL="release/Collect-TCG-Dev-${RELEASE_VERSION}-full.zip"
          PATCH="release/Collect-TCG-Dev-${PREVIOUS_VERSION}-to-${RELEASE_VERSION}-patch.zip"
          git archive --format=zip --output="$FULL" HEAD
          while IFS= read -r -d '' path; do mkdir -p ".release-patch/$(dirname "$path")"; cp -a "$path" ".release-patch/$path"; done < <(git diff --name-only --diff-filter=ACMRT -z "$PREVIOUS_COMMIT" HEAD)
          git diff --name-only --diff-filter=D "$PREVIOUS_COMMIT" HEAD > .release-patch/PATCH-DELETIONS.txt
          (cd .release-patch && zip -qr "../$PATCH" .)
          unzip -tq "$FULL"
          unzip -tq "$PATCH"
          sha256sum "$FULL" "$PATCH" | tee release/checksums.txt
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Dev-2026-11-14-v01-packages
          path: |
            release/Collect-TCG-Dev-2026-11-14-v01-full.zip
            release/Collect-TCG-Dev-2026-11-12-v07-to-2026-11-14-v01-patch.zip
            release/checksums.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record immutable release manifest
        run: |
          set -euo pipefail
          MANIFEST='release-manifests/2026-11-14-v01.txt'
          test ! -e "$MANIFEST"
          {
            echo 'Version: 2026-11-14-v01'
            echo 'Previous version: 2026-11-12-v07'
            echo "Source commit: $(git rev-parse HEAD)"
            echo 'Purpose: validate the November 13–14 Development updates and exercise generated Facebook posts.'
            echo 'Full ZIP: Collect-TCG-Dev-2026-11-14-v01-full.zip'
            echo 'Patch ZIP: Collect-TCG-Dev-2026-11-12-v07-to-2026-11-14-v01-patch.zip'
            echo 'SQL required: No for validation and existing storefront updates. Experimental Development eBay feedback depends on its separate migration and is excluded from promotion.'
            echo 'Validation: npm run validate; SEO workflow guard and generator self-test; full and patch ZIP integrity.'
            echo 'Validation limitations: no interactive desktop/mobile/Safari browser test.'
            echo
            cat release/checksums.txt
          } > "$MANIFEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MANIFEST"
          git commit -m 'Development 2026-11-14-v01: record package validation'
          git pull --rebase origin main
          git push
