name: Development Release
# 2026-11-10-v04 retry after Development SEO refresh.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-dev.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: development-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Feature regression tests
        run: npm test
      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          for file in $(find dev/src -name '*.js' -type f); do node --check "$file"; done
          node --check tools/generate-seo.mjs
      - name: eBay navigation cleanup contract
        run: |
          set -euo pipefail
          grep -Fq "#/inventory-tools?mode=ebay&sub=banlist" dev/src/features/owner/ebay-banlist.js
          ! grep -Fq 'addNavLink(document.getElementById("premiumDesktopMoreMenu")' dev/src/features/owner/ebay-banlist.js
          ! grep -Fq 'addNavLink(document.getElementById("mainnav")' dev/src/features/owner/ebay-banlist.js
          grep -Fq "['banlist','eBay Ban List']" dev/src/features/owner/ebay-messages.js
          grep -Fq 'ebay-banlist.js?v=2026-11-03-v01' dev/src/app/register-features.js
      - name: Facebook link and snapshot date contracts
        run: |
          set -euo pipefail
          grep -Fq 'posts-ebay-link.js?v=2026-11-03-v01' dev/src/app/register-features.js
          grep -Fq 'analytics.js?v=2026-11-04-v01' dev/src/app/register-features.js
          grep -Fq '🛒 eBay Listing:' dev/src/features/social/posts-ebay-link.js
          grep -Fq '.select("created_at")' dev/src/services/analytics.js
          grep -Fq 'const daysListed=validCreatedAt' dev/src/services/analytics.js
          ! sed -n '/async function captureSaleConversionSnapshot(card)/,/function getAnalyticsSessionId()/p' dev/src/services/analytics.js | grep -Fq '2000-01-01'
      - name: Retained eBay tools contracts
        run: |
          set -euo pipefail
          grep -Fq "['messages','eBay Messages']" dev/src/features/owner/ebay-messages.js
          grep -Fq "['listing-status','eBay Listing Status']" dev/src/features/owner/ebay-messages.js
          grep -Fq 'positive feedback for our store' dev/src/features/owner/ebay-messages.js
          grep -Fq 'It will be shipped over the weekend.' dev/src/features/owner/ebay-messages.js
          grep -Fq 'Listed on eBay' dev/src/features/owner/ebay-listing-status.js
          grep -Fq 'On eBay only' dev/src/features/owner/ebay-listing-status.js
          grep -Fq 'notesWithEbayListing' dev/src/features/owner/ebay-listing-status.js
          grep -Fq 'class="detail-ebay-cta"' dev/src/features/cards/details.js
          grep -Fq 'View on eBay' dev/src/features/cards/details.js
          grep -Fq 'target="_blank" rel="noopener noreferrer"' dev/src/features/cards/details.js
          grep -Fq 'details.js?v=2026-11-10-v02' dev/src/app/register-features.js
          grep -Fq '02-components.css?v=2026-11-10-v04' dev/index.html
      - name: Retained FX and HEIC contracts
        run: |
          set -euo pipefail
          grep -Fq 'FX_NORMAL_CONVERSION_BELOW_MYR=400' dev/src/features/owner/fx-low-price.js
          grep -Fq 'Math.round(raw)' dev/src/features/owner/fx-low-price.js
          grep -Fq 'image/heic-sequence' dev/src/features/media/heic-support.js
          grep -Fq 'image/heif-sequence' dev/src/features/media/heic-support.js
          grep -Fq 'convertHeicOwnerImage' dev/src/features/media/heic-support.js
      - name: Card-list official eBay footer regression contract
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const source=fs.readFileSync('dev/src/features/social/posts-card-list.js','utf8');
          const full=source.split('function buildFbCardListPost(')[1].split('function buildFbCardDropPost(')[0];
          const drop=source.split('function buildFbCardDropPost(')[1].split('function balancedCardDropCards(')[0];
          for(const section of [full,drop]) assert.equal((section.match(/\.\.\.officialEbayAccountLines\(\)/g)||[]).length,1);
          assert.equal((source.match(/View our seller history and feedback/g)||[]).length,0);
          for(let i=1;i<=5;i++) assert.match(source,new RegExp('COLLECT_TCG_'+i+': https://www\\.ebay\\.'));
          assert.match(fs.readFileSync('dev/src/features/social/posts.js','utf8'),/posts-card-list\.js\?v=2026-11-05-v04/);
          NODE
      - name: Recently viewed country attribution contract
        run: |
          set -euo pipefail
          grep -Fq 'recentQualifiedCountries:[],recentQualifiedCountriesSupported:false' dev/src/features/owner/insights.js
          grep -Fq 'function recentQualifiedCountryLabel(cardId)' dev/src/features/owner/insights.js
          grep -Fq 'appContext.fetchCountryCardViewInsights(startDate,endDate)' dev/src/features/owner/insights.js
          grep -Fq 'const country=recentQualifiedCountryLabel(card.id);' dev/src/features/owner/insights.js
          grep -Fq 'Country unknown' dev/src/features/owner/insights.js
          grep -Fq 'country_code' dev/src/services/analytics.js

      - name: SEO self-test and generation
        run: |
          set -euo pipefail
          node tools/generate-seo.mjs --self-test
          node tools/generate-seo.mjs --dev
          test -s dev/sitemap.xml
          test -s dev/robots.txt
          test -s dev/seo-slugs.json
          test -s dev/owner-card-routes.json
          grep -q 'Disallow: /' dev/robots.txt
          grep -q 'noindex,nofollow,noarchive' dev/cards/*/index.html
          if grep -Eq '/cards/[^<]*/?--[0-9a-fA-F-]{20,40}/' dev/sitemap.xml; then exit 1; fi
      - name: Repository and CSS validation
        run: |
          set -euo pipefail
          npm run check
          npm run check:css
          bash tools/release-contracts.sh
          git diff --check
      - name: Create and verify packages
        env:
          RELEASE_VERSION: 2026-11-10-v04
          PREVIOUS_VERSION: 2026-11-10-v03
          PREVIOUS_COMMIT: ec4b5963bfdbb97978a9267bd2654f1371d7d589
        run: |
          set -euo pipefail
          rm -rf .release-patch release
          mkdir -p release .release-patch
          FULL="release/Collect-TCG-Dev-${RELEASE_VERSION}-full.zip"
          PATCH="release/Collect-TCG-Dev-${PREVIOUS_VERSION}-to-${RELEASE_VERSION}-patch.zip"
          git archive --format=zip --output="$FULL" HEAD
          while IFS= read -r -d '' path; do mkdir -p ".release-patch/$(dirname "$path")"; cp -a "$path" ".release-patch/$path"; done < <(git diff --name-only --diff-filter=ACMRT -z "$PREVIOUS_COMMIT" HEAD)
          git diff --name-only --diff-filter=D "$PREVIOUS_COMMIT" HEAD > .release-patch/PATCH-DELETIONS.txt
          (cd .release-patch && zip -qr "../$PATCH" .)
          unzip -tq "$FULL"
          unzip -tq "$PATCH"
          sha256sum "$FULL" "$PATCH" | tee release/checksums.txt
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Dev-2026-11-10-v04-packages
          path: |
            release/Collect-TCG-Dev-2026-11-10-v04-full.zip
            release/Collect-TCG-Dev-2026-11-10-v03-to-2026-11-10-v04-patch.zip
            release/checksums.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record immutable release manifest
        run: |
          set -euo pipefail
          MANIFEST='release-manifests/2026-11-10-v04.txt'
          test ! -e "$MANIFEST"
          {
            echo 'Version: 2026-11-10-v04'
            echo 'Previous version: 2026-11-10-v03'
            echo "Source commit: $(git rev-parse HEAD)"
            echo 'Purpose: make paired mobile Contact to Buy and View on eBay actions compact and identical in size.'
            echo 'Full ZIP: Collect-TCG-Dev-2026-11-10-v04-full.zip'
            echo 'Patch ZIP: Collect-TCG-Dev-2026-11-10-v03-to-2026-11-10-v04-patch.zip'
            echo 'SQL required: No'
            echo 'Validation: feature tests; all Development JavaScript syntax; Recently Viewed country attribution contract; eBay navigation cleanup, retained eBay tools, compact paired mobile purchase-action sizing, direct card-detail eBay CTA, and weekend dispatch message contracts; retained FX/HEIC contracts; repository/CSS/release contracts; SEO self-test/generation/output validation; package integrity.'
            echo 'Validation limitations: no interactive desktop/mobile/Safari browser test.'
            echo
            cat release/checksums.txt
          } > "$MANIFEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MANIFEST"
          git commit -m 'Development 2026-11-10-v04: record package validation'
          git pull --rebase origin main
          git push
