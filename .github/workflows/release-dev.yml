name: Development Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-dev.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: development-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Feature regression tests
        run: npm test
      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          for file in $(find dev/src -name '*.js' -type f); do node --check "$file"; done
          node --check tools/generate-seo.mjs
      - name: SEO self-test and generation
        run: |
          node tools/generate-seo.mjs --self-test
          node tools/generate-seo.mjs --dev
      - name: Repository and CSS validation
        run: |
          set -euo pipefail
          npm run check
          npm run check:css
          bash tools/release-contracts.sh
          grep -Fq 'card-owner-category.js?v=2026-10-30-v03' dev/src/app/register-features.js
          grep -Fq 'dashboard.js?v=2026-10-30-v03' dev/src/app/register-features.js
          git diff --check
      - name: Create and verify packages
        env:
          RELEASE_VERSION: 2026-10-30-v03
          PREVIOUS_VERSION: 2026-10-30-v02
          PREVIOUS_COMMIT: 2c06ffb8b8c8962ecd3e66f52e240240579b10b1
        run: |
          set -euo pipefail
          mkdir -p release .release-patch
          FULL="release/Collect-TCG-Dev-${RELEASE_VERSION}-full.zip"
          PATCH="release/Collect-TCG-Dev-${PREVIOUS_VERSION}-to-${RELEASE_VERSION}-patch.zip"
          git archive --format=zip --output="$FULL" HEAD
          while IFS= read -r -d '' path; do mkdir -p ".release-patch/$(dirname "$path")"; cp -a "$path" ".release-patch/$path"; done < <(git diff --name-only --diff-filter=ACMRT -z "$PREVIOUS_COMMIT" HEAD)
          git diff --name-only --diff-filter=D "$PREVIOUS_COMMIT" HEAD > .release-patch/PATCH-DELETIONS.txt
          (cd .release-patch && zip -qr "../$PATCH" .)
          unzip -tq "$FULL"
          unzip -tq "$PATCH"
          sha256sum "$FULL" "$PATCH" | tee release/checksums.txt
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Dev-2026-10-30-v03-packages
          path: |
            release/Collect-TCG-Dev-2026-10-30-v03-full.zip
            release/Collect-TCG-Dev-2026-10-30-v02-to-2026-10-30-v03-patch.zip
            release/checksums.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record immutable release manifest
        run: |
          set -euo pipefail
          MANIFEST='release-manifests/2026-10-30-v03.txt'
          test ! -e "$MANIFEST"
          {
            echo 'Version: 2026-10-30-v03'
            echo 'Previous version: 2026-10-30-v02'
            echo "Source commit: $(git rev-parse HEAD)"
            echo 'Full ZIP: Collect-TCG-Dev-2026-10-30-v03-full.zip'
            echo 'Patch ZIP: Collect-TCG-Dev-2026-10-30-v02-to-2026-10-30-v03-patch.zip'
            echo
            cat release/checksums.txt
          } > "$MANIFEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MANIFEST"
          git commit -m 'Development 2026-10-30-v03: record package validation'
          git push
