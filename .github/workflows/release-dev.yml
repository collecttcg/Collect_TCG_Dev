name: Development Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-dev.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: development-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Feature regression tests
        run: npm test
      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          for file in $(find dev/src -name '*.js' -type f); do node --check "$file"; done
          node --check tools/generate-seo.mjs
      - name: Inventory sort integration contract
        run: |
          set -euo pipefail
          grep -Fq 'Most Popular' dev/src/features/inventory/sort-toolbar.js
          grep -Fq 'price-low' dev/src/features/inventory/sort-toolbar.js
          grep -Fq 'mobileInlineSortBtn' dev/src/features/inventory/sort-toolbar.js
          grep -Fq 'grid-template-columns:minmax(0,1fr) auto auto auto' dev/src/features/inventory/sort-toolbar.js
          grep -Fq 'inventory/sort-toolbar.js?v=2026-10-31-v06' dev/src/main.js
      - name: HEIC Add/Edit integration contract
        run: |
          set -euo pipefail
          grep -Fq 'image/heic-sequence' dev/src/features/media/heic-support.js
          grep -Fq 'image/heif-sequence' dev/src/features/media/heic-support.js
          grep -Fq 'nativeHeicToJpegBlob' dev/src/features/media/heic-support.js
          grep -Fq 'heic-to@1.6.7/dist/iife/heic-to.js' dev/src/features/media/heic-support.js
          grep -Fq 'const converted=await heicTo({blob:file,type:"image/jpeg",quality:0.94})' dev/src/features/media/heic-support.js
          grep -Fq 'convertHeicOwnerImage' dev/src/features/media/heic-support.js
          grep -Fq "features/media/heic-support.js?v=2026-10-30-v06" dev/src/app/register-features.js
          grep -Fq 'wireImageControls("add"' dev/src/features/owner/add.js
          grep -Fq 'wireImageControls("edit"' dev/src/features/owner/editor.js
          grep -Fq 'accept="image/jpeg,image/png,image/webp"' dev/src/features/owner/forms.js
      - name: SEO self-test and generation
        run: |
          node tools/generate-seo.mjs --self-test
          node tools/generate-seo.mjs --dev
      - name: Repository and CSS validation
        run: |
          set -euo pipefail
          npm run check
          npm run check:css
          bash tools/release-contracts.sh
          git diff --check
      - name: Create and verify packages
        env:
          RELEASE_VERSION: 2026-10-31-v02
          PREVIOUS_VERSION: 2026-10-31-v01
          PREVIOUS_COMMIT: c2636c086462e59729b297ebd49083464d9031ec
        run: |
          set -euo pipefail
          rm -rf .release-patch
          mkdir -p release .release-patch
          FULL="release/Collect-TCG-Dev-${RELEASE_VERSION}-full.zip"
          PATCH="release/Collect-TCG-Dev-${PREVIOUS_VERSION}-to-${RELEASE_VERSION}-patch.zip"
          git archive --format=zip --output="$FULL" HEAD
          while IFS= read -r -d '' path; do mkdir -p ".release-patch/$(dirname "$path")"; cp -a "$path" ".release-patch/$path"; done < <(git diff --name-only --diff-filter=ACMRT -z "$PREVIOUS_COMMIT" HEAD)
          git diff --name-only --diff-filter=D "$PREVIOUS_COMMIT" HEAD > .release-patch/PATCH-DELETIONS.txt
          (cd .release-patch && zip -qr "../$PATCH" .)
          unzip -tq "$FULL"
          unzip -tq "$PATCH"
          sha256sum "$FULL" "$PATCH" | tee release/checksums.txt
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Collect-TCG-Dev-2026-10-31-v02-packages
          path: |
            release/Collect-TCG-Dev-2026-10-31-v02-full.zip
            release/Collect-TCG-Dev-2026-10-31-v01-to-2026-10-31-v02-patch.zip
            release/checksums.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record immutable release manifest
        run: |
          set -euo pipefail
          MANIFEST='release-manifests/2026-10-31-v02.txt'
          test ! -e "$MANIFEST"
          {
            echo 'Version: 2026-10-31-v02'
            echo 'Previous version: 2026-10-31-v01'
            echo "Source commit: $(git rev-parse HEAD)"
            echo 'Full ZIP: Collect-TCG-Dev-2026-10-31-v02-full.zip'
            echo 'Patch ZIP: Collect-TCG-Dev-2026-10-31-v01-to-2026-10-31-v02-patch.zip'
            echo
            cat release/checksums.txt
          } > "$MANIFEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MANIFEST"
          git commit -m 'Development 2026-10-31-v02: record package validation'
          git push
